image: node

build:
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist

pages:
  stage: deploy
  dependencies:
    - build
  script:
  - mkdir -p public
  - cp -r dist/* public/
  - cp public/index.html public/404.html  # SPA fallback
  artifacts:
    paths:
      - public
